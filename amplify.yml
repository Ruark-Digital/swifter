version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm@10.21.0
        - pnpm install --frozen-lockfile
        - pnpm rebuild esbuild sharp core-js pdf2html
    build:
      commands:
        - pnpm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - ~/.pnpm-store/**/*
